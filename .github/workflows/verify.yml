name: Verify Woodworking Tools
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the preview with no index
        run: python3 build.py
      - name: Validate browser module syntax
        run: node --check src/app.mjs && node --check src/calcs.mjs
      - name: Run geometry checks
        run: node --test tests/*.test.mjs
      - name: Validate prerendered routes and noindex policy
        run: python3 tests/validate_static.py
      - name: Install browser test dependency
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium --only-shell
      - name: Test real browser calculations, exports and responsive layouts
        run: npx playwright test
      - name: Upload desktop and mobile design snapshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-ui-screenshots
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 4
      - name: Upload printable A4 and Letter calibration worksheets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: print-calibration-pdfs
          path: print-evidence/
          if-no-files-found: error
          retention-days: 4
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5

