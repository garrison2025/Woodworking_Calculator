name: Verify Woodworking Tools
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the preview with no index
        run: python3 build.py
      - name: Validate browser module and test syntax
        run: node --check src/app.mjs && node --check src/calcs.mjs && node --check src/cut-list.mjs && node --check playwright.config.mjs && node --check tests/e2e/workspaces.spec.mjs && node --check tests/e2e/cross-browser.spec.mjs && node --check tests/cut-list.test.mjs
      - name: Run geometry checks
        run: node --test tests/*.test.mjs
      - name: Validate prerendered routes and noindex policy
        run: python3 tests/validate_static.py
      - name: Install browser test dependency
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium --only-shell
      - name: Test real Chromium calculations, exports and responsive layouts
        run: npx playwright test --project=chromium
      - name: Audit actual 540-row and specialist A4/Letter PDF content
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pypdf==5.9.0
          python3 tests/audit_long_print_pdf.py print-evidence/segmented-bowl-540-a4.pdf A4 180 3 5
          python3 tests/audit_long_print_pdf.py print-evidence/segmented-bowl-540-letter.pdf Letter 180 3 5
          python3 tests/audit_specialty_print_pdf.py print-evidence
      - name: Install cross-engine Firefox and WebKit browsers
        run: npx playwright install --with-deps firefox webkit
      - name: Smoke-test actual Firefox and Linux WebKit DOM, geometry and export
        run: npx playwright test tests/e2e/cross-browser.spec.mjs --project=firefox --project=webkit
      - name: Validate indexing gate and offline SEO release layout (no deployment)
        run: |
          SITE_URL=https://woodworking.example RELEASE_APPROVED=0 python3 build.py
          python3 tests/validate_static.py
          SITE_URL=https://woodworking.example RELEASE_APPROVED=1 python3 build.py
          python3 tests/validate_release.py
      - name: Upload desktop and mobile design snapshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-ui-screenshots
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 4
      - name: Upload printable A4 and Letter calibration worksheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-calibration-pdfs
          path: print-evidence/
          if-no-files-found: warn
          retention-days: 4
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5

