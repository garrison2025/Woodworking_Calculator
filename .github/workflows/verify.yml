name: Verify Woodworking Tools
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the preview with no index
        run: python3 build.py
      - name: Validate browser module and test syntax
        run: node --check src/app.mjs && node --check src/home.mjs && node --check src/length-entry.mjs && node --check tests/length-entry.test.mjs && node --check tests/e2e/inch-fractions.spec.mjs && node --check src/measurement-links.mjs && node --check src/measurement-files.mjs && node --check tests/measurement-files.test.mjs && node --check tests/e2e/measurement-files.spec.mjs && node --check tests/e2e/deck-joist-equalized-layout.spec.mjs && node --check tests/e2e/mobile-accessibility.spec.mjs && node --check tests/e2e/runtime-payload.spec.mjs && node --check tests/e2e/measurement-links.spec.mjs && node --check tests/e2e/homepage-release.spec.mjs && node --check tests/e2e/critical-cut-resolution.spec.mjs && node --check tests/e2e/cut-visual-contract.spec.mjs && node --check tests/e2e/specialty-precision.spec.mjs && node --check src/calcs.mjs && node --check src/cut-list.mjs && node --check playwright.config.mjs && node --check tests/e2e/workspaces.spec.mjs && node --check tests/e2e/final-acceptance.spec.mjs && node --check tests/e2e/cross-browser.spec.mjs && node --check tests/cut-list.test.mjs && node --check tests/worked-cases.test.mjs && node --check tests/e2e/worked-cases.spec.mjs
      - name: Run geometry checks
        run: node --test tests/*.test.mjs
      - name: Validate prerendered routes and noindex policy
        run: python3 tests/validate_static.py
      - name: Validate final 31-route task intents and 22 historical keyword cautions
        run: python3 tests/validate_keyword_closure.py
      - name: Check all 152 historical keyword research decisions against reviewed sources
        run: python3 scripts/export_keyword_review_register.py --check
      - name: Test deployment acceptance script without touching the public site
        run: python3 -m unittest discover -s tests -p "test_live_launch_audit.py" -v
      - name: Install browser test dependency
        run: npm ci --no-audit --no-fund
      - name: Install headless Chromium
        # ubuntu-latest already ships common Chromium runtime libraries.
        # Avoid an unnecessary apt-get update in this step; on some runner
        # images it can stall before the actual browser test starts.
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: npx playwright install chromium --only-shell
      - name: Test real Chromium calculations, exports and responsive layouts
        run: npx playwright test --project=chromium
      - name: Audit actual 540-row and specialist A4/Letter PDF content
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pypdf==5.9.0
          python3 tests/audit_long_print_pdf.py print-evidence/segmented-bowl-540-a4.pdf A4 180 3 5
          python3 tests/audit_long_print_pdf.py print-evidence/segmented-bowl-540-letter.pdf Letter 180 3 5
          python3 tests/audit_specialty_print_pdf.py print-evidence
      - name: Install cross-engine Firefox and WebKit browsers
        run: npx playwright install --with-deps firefox webkit
      - name: Smoke-test actual Firefox and Linux WebKit DOM, geometry and export
        run: npx playwright test tests/e2e/cross-browser.spec.mjs --project=firefox --project=webkit
      - name: Validate indexing gate and offline SEO release layout (no deployment)
        run: |
          SITE_URL=https://woodworking.example RELEASE_APPROVED=0 python3 build.py
          python3 tests/validate_static.py
          SITE_URL=https://woodworking.example RELEASE_APPROVED=1 python3 build.py
          python3 tests/validate_release.py
          SITE_URL=https://woodworking.example RELEASE_APPROVED=1 RELEASE_V3_P2_APPROVED=1 python3 build.py
          RELEASE_V3_P2_APPROVED=1 python3 tests/validate_release.py
          # An accidental RELEASE_APPROVED=1 in a Pages preview branch still
          # MUST produce noindex and no sitemap or canonical.
          CF_PAGES=1 CF_PAGES_BRANCH=feature/preview SITE_URL=https://woodworking.example RELEASE_APPROVED=1 RELEASE_V3_P2_APPROVED=1 python3 build.py
          python3 tests/validate_static.py
          # The same explicit release gate on the real main branch is valid.
          CF_PAGES=1 CF_PAGES_BRANCH=main SITE_URL=https://woodworking.example RELEASE_APPROVED=1 python3 build.py
          python3 tests/validate_release.py
      - name: Upload desktop and mobile design snapshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-ui-screenshots
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 4
      - name: Upload printable A4 and Letter calibration worksheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-calibration-pdfs
          path: print-evidence/
          if-no-files-found: warn
          retention-days: 4
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5



  macos-webkit:
    # Real macOS-hosted WebKit engine: closer platform coverage than Linux
    # WebKit but still NOT the branded Safari app or VoiceOver screen reader.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render prelaunch static HTML without indexing
        run: python3 build.py
      - name: Reproducibly install browser dependencies
        run: npm ci --no-audit --no-fund
      - name: Install macOS-hosted WebKit
        run: npx playwright install webkit
      - name: Test actual macOS WebKit calculation and accessibility layouts
        run: npx playwright test tests/e2e/cross-browser.spec.mjs tests/e2e/mobile-accessibility.spec.mjs --project=webkit
      - name: Preserve macOS browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-webkit-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deployed-preview:
    # The already-merged main commit is the only source of truth for a live
    # deployment. A PR's unmerged HTML/JS intentionally MUST NOT be compared
    # against production Pages, so this job never runs on pull_request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, macos-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for read-only Cloudflare audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm real Pages preview serves current main source
        run: |
          python3 - <<'PY'
          import subprocess, sys, time
          args = [
              sys.executable, "scripts/verify_live_launch.py",
              "--base", "https://woodworking-calculator.pages.dev",
              "--mode", "preview", "--verify-source-parity",
              "--report", "live-preview-audit.json",
          ]
          # Cloudflare Pages builds may finish after GitHub CI. Retry the
          # actual source-parity check; do not treat a stale deploy as success.
          for attempt in range(1, 7):
              print(f"Live deployment acceptance attempt {attempt}/6", flush=True)
              result = subprocess.run(args, check=False)
              if result.returncode == 0:
                  print("Verified: 42 live pages + 31 current config objects + 31 live forms + 11 current source assets.", flush=True)
                  raise SystemExit(0)
              if attempt < 6:
                  print("Deployment not yet identical or audit failed; retry in 20 s.", flush=True)
                  time.sleep(20)
          print("FAIL: Live Pages still does not match this main commit or cannot be reached.", file=sys.stderr)
          raise SystemExit(1)
          PY
      - name: Preserve independent real-Pages HTTP and source-parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-live-preview-audit
          path: live-preview-audit.json
          if-no-files-found: warn
          retention-days: 7
