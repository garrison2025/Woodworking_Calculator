name: WoodLayout GEO crawler access audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "src/tools.json"
      - "src/tool-intents.json"
      - "src/category-guides.json"
      - "scripts/verify_geo_access.py"
      - ".github/workflows/geo-crawler-audit.yml"

permissions:
  contents: read

jobs:
  live-geo-access:
    name: Check AI/search crawler access on woodlayout.com
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for Pages deploy and verify live GEO access
        run: |
          for attempt in 1 2 3 4; do
            echo "Live GEO audit attempt ${attempt}/4"
            if python3 scripts/verify_geo_access.py --base https://woodlayout.com --report woodlayout-geo-access.json; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Deployment or crawler access is not ready; retrying in 20 seconds."
              sleep 20
            fi
          done
          echo "GEO crawler access audit failed after four attempts."
          exit 1
      - name: Preserve live GEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woodlayout-geo-crawler-access
          path: woodlayout-geo-access.json
          if-no-files-found: warn
          retention-days: 14
